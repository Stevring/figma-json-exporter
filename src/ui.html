<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figma JSON Exporter</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: transparent;
    }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      gap: 8px;
      padding: 12px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: #ffffff;
      color: #111;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    .viewer {
      flex: 1;
      min-height: 0;
      width: 100%;
      resize: none;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
      background: #f8f8f8;
      color: #111;
    }

    .status {
      font-size: 11px;
      color: #666;
      min-height: 14px;
    }

    .resize-handle {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      border-right: 2px solid rgba(0, 0, 0, 0.35);
      border-bottom: 2px solid rgba(0, 0, 0, 0.35);
    }

    @media (prefers-color-scheme: dark) {
      button {
        border-color: rgba(255, 255, 255, 0.2);
        background: #1f1f1f;
        color: #f5f5f5;
      }

      .viewer {
        background: #121212;
        color: #f5f5f5;
        border-color: rgba(255, 255, 255, 0.2);
      }

      .status {
        color: #aaa;
      }

      .resize-handle {
        border-color: rgba(255, 255, 255, 0.5);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <button id="export-btn">Export</button>
      <button id="export-parent-btn">Export (only parent)</button>
      <button id="download-btn">Download</button>
    </div>
    <textarea id="viewer" class="viewer" spellcheck="false" placeholder="JSON output will appear here..."></textarea>
    <div id="status" class="status"></div>
    <div id="resize-handle" class="resize-handle" aria-hidden="true"></div>
  </div>

  <script type="module" src="./ui.js"></script>
</body>
</html>
